<svg viewBox="0 0 900 1200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bodyGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F3F4F6"/>
      <stop offset="55%" stop-color="#E5E7EB"/>
      <stop offset="100%" stop-color="#D1D5DB"/>
    </linearGradient>
    <linearGradient id="screenGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0E2A32"/>
      <stop offset="100%" stop-color="#081A20"/>
    </linearGradient>
    <linearGradient id="probeGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#C7CCD1"/>
      <stop offset="100%" stop-color="#9AA1A9"/>
    </linearGradient>
  </defs>
  <rect width="900" height="1200" fill="white"/>
  <g transform="translate(450.0 96.0) rotate(-6)" transform-origin="450.0 600.0">
  <!-- probe tip -->
  <rect x="432.0" y="744.0" width="36" height="360.0" rx="18" fill="url(#probeGrad)" stroke="#111827" stroke-width="2"/>
  <circle cx="450.0" cy="1080.0" r="20" fill="#8B939B" stroke="#111827" stroke-width="2"/>
  <!-- body -->
  <rect x="360.0" y="48.0" width="180" height="720.0" rx="46" fill="url(#bodyGrad)" stroke="#111827" stroke-width="3"/>
  <!-- screen -->
  <rect x="386.0" y="108.0" width="128" height="120" rx="16" fill="url(#screenGrad)"/>
  <text x="450.0" y="178.0" font-family="Poppins, sans-serif" font-size="46" font-weight="600" fill="#F97316" text-anchor="middle">7.2</text>
  <text x="450.0" y="208.0" font-family="Poppins, sans-serif" font-size="16" letter-spacing="2" fill="#9fd6d1" text-anchor="middle">pH  •  27.4°C</text>
  <!-- button -->
  <circle cx="450.0" cy="504.0" r="26" fill="#F97316"/>
  <circle cx="450.0" cy="504.0" r="26" fill="none" stroke="#EA580C" stroke-width="2"/>
  <!-- brand groove lines -->
  <line x1="390.0" y1="600.0" x2="510.0" y2="600.0" stroke="#111827" stroke-width="1" opacity="0.25"/>
  <line x1="390.0" y1="648.0" x2="510.0" y2="648.0" stroke="#111827" stroke-width="1" opacity="0.25"/>
  </g>
</svg>